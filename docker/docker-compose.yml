networks:
  distnet:
    driver: bridge

volumes:
  lock1_data:
  lock2_data:
  lock3_data:
  queue1_data:
  queue2_data:
  queue3_data:
  cache1_data:
  cache2_data:
  cache3_data:
  redis_data:

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1000", "--loglevel", "warning"]
    ports: ["6379:6379"]
    networks: [distnet]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  lock1:
    build: { context: .., dockerfile: docker/Dockerfile.node }
    networks: [distnet]
    environment:
      ROLE: "lock"
      NODE_ID: "lock1"
      HTTP_PORT: "8080"
      CLUSTER_NODES: "http://lock1:8080,http://lock2:8081,http://lock3:8082"
      REDIS_URL: "redis://redis:6379/0"
      LOG_LEVEL: "INFO"
    command: ["uvicorn", "nodes.base_node:app", "--host", "0.0.0.0", "--port", "8080"]
    ports: ["8080:8080"]
    volumes: [lock1_data:/data]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  lock2:
    build: { context: .., dockerfile: docker/Dockerfile.node }
    networks: [distnet]
    environment:
      ROLE: "lock"
      NODE_ID: "lock2"
      HTTP_PORT: "8081"
      CLUSTER_NODES: "http://lock1:8080,http://lock2:8081,http://lock3:8082"
      REDIS_URL: "redis://redis:6379/0"
      LOG_LEVEL: "INFO"
    command: ["uvicorn", "nodes.base_node:app", "--host", "0.0.0.0", "--port", "8081"]
    ports: ["8081:8081"]
    volumes: [lock2_data:/data]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/readyz"]
      interval: 5s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  lock3:
    build: { context: .., dockerfile: docker/Dockerfile.node }
    networks: [distnet]
    environment:
      ROLE: "lock"
      NODE_ID: "lock3"
      HTTP_PORT: "8082"
      CLUSTER_NODES: "http://lock1:8080,http://lock2:8081,http://lock3:8082"
      REDIS_URL: "redis://redis:6379/0"
      LOG_LEVEL: "INFO"
    command: ["uvicorn", "nodes.base_node:app", "--host", "0.0.0.0", "--port", "8082"]
    ports: ["8082:8082"]
    volumes: [lock3_data:/data]
    depends_on: { redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/readyz"]
