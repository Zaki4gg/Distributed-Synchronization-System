      timeout: 2s
      retries: 30
    restart: unless-stopped

  queue1:
    build: { context: .., dockerfile: docker/Dockerfile.node }
    networks: [distnet]
    environment:
      ROLE: "queue"
      NODE_ID: "queue1"
      HTTP_PORT: "8180"
      REDIS_URL: "redis://redis:6379/0"
      LOG_LEVEL: "INFO"
      CLUSTER_PEERS: "http://queue1:8180,http://queue2:8181,http://queue3:8182"
      QUEUE_REPLICA_FACTOR: "2"
